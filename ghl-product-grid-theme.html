<!-- Shared product grid theme for GHL native product lists.
     Prepared locally; paste into the site's global head tracking/custom code.
     Keeps native product links, size selection, filtering and pagination intact. -->
<style id="ynd-native-shared-product-grid">
:is(body,#section-wD90by-v5Q) .product-list-container{
  display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;
  align-items:stretch!important;gap:48px 28px!important;
}
:is(#section-wD90by-v5Q,.product-list-container) .hl-product-list-item,
:is(#section-wD90by-v5Q,.product-list-container) .product-item-wrapper{
  min-width:0!important;height:100%!important;background:transparent!important;
  border:0!important;box-shadow:none!important;
}
:is(#section-wD90by-v5Q,.product-list-container) .hl-product-list-item-details{
  width:100%!important;height:100%!important;padding:0!important;
  background:transparent!important;border:0!important;border-radius:0!important;
  box-shadow:none!important;overflow:visible!important;font-family:Manrope,Arial,sans-serif!important;
}
:is(#section-wD90by-v5Q,.product-list-container) .image-wrapper{
  position:relative!important;width:100%!important;height:auto!important;aspect-ratio:1!important;
  margin:0 0 16px!important;padding:0!important;border:0!important;
  border-radius:20px!important;overflow:hidden!important;background:transparent!important;
}
:is(#section-wD90by-v5Q,.product-list-container) .hl-product-list-product-image{
  display:block!important;width:100%!important;height:100%!important;max-height:none!important;
  object-fit:contain!important;transform:none!important;
  transition:transform .65s cubic-bezier(.22,1,.36,1)!important;
}
:is(#section-wD90by-v5Q,.product-list-container) .hl-product-list-item:hover img,
:is(#section-wD90by-v5Q,.product-list-container) .product-item-wrapper:hover img{transform:none!important}
:is(#section-wD90by-v5Q,.product-list-container) .image-wrapper:hover .hl-product-list-product-image{transform:scale(1.035)!important}
:is(#section-wD90by-v5Q,.product-list-container) .hl-product-list-product-name{
  display:-webkit-box!important;-webkit-box-orient:vertical!important;-webkit-line-clamp:2!important;
  overflow:hidden!important;white-space:normal!important;margin:0 0 6px!important;padding:0!important;
  font:500 21px/1.35 Manrope,Arial,sans-serif!important;letter-spacing:-.5px!important;
  color:#f5f5f5!important;text-align:left!important;
}
:is(#section-wD90by-v5Q,.product-list-container) .hl-product-list-product-price{
  margin:0!important;padding:0!important;font:400 14px/1.5 Manrope,Arial,sans-serif!important;color:#f5f5f5!important;
}
:is(#section-wD90by-v5Q,.product-list-container) :is(.hl-product-list-price-override,.hl-product-list-price-discount,.ec-review-stars,.single-star-rating,.ec-subscription-pills-container){display:none!important}
/* This visual cue overlays the native clickable product image; native navigation handles selection. */
:is(#section-wD90by-v5Q,.product-list-container) .image-wrapper::after{
  content:"Choose size";position:absolute;z-index:2;bottom:18px;left:50%;
  transform:translate(-50%,8px);opacity:0;visibility:hidden;pointer-events:none;
  display:flex;align-items:center;justify-content:center;min-height:44px;
  max-width:calc(100% - 32px);padding:11px 24px;border:1px solid #d99b7470;
  border-radius:30px;background:#ac6845;color:#080808;white-space:nowrap;
  font:600 13px/1.3 Manrope,Arial,sans-serif;
  transition:opacity .25s ease,transform .3s ease,visibility .25s;
}
:is(#section-wD90by-v5Q,.product-list-container) .image-wrapper:hover::after,
:is(#section-wD90by-v5Q,.product-list-container) :is(.hl-product-list-item,.product-item-wrapper):focus-within .image-wrapper::after{
  opacity:1;visibility:visible;transform:translate(-50%,0);
}
@media(max-width:1000px){:is(body,#section-wD90by-v5Q) .product-list-container{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
@media(max-width:560px){
  :is(body,#section-wD90by-v5Q) .product-list-container{gap:32px 16px!important}
  :is(#section-wD90by-v5Q,.product-list-container) .image-wrapper{border-radius:16px!important;margin-bottom:13px!important}
  :is(#section-wD90by-v5Q,.product-list-container) .hl-product-list-product-name{font-size:18px!important}
  :is(#section-wD90by-v5Q,.product-list-container) .hl-product-list-product-price{font-size:13px!important}
}
@media(hover:none),(pointer:coarse){:is(#section-wD90by-v5Q,.product-list-container) .image-wrapper::after{opacity:1;visibility:visible;transform:translate(-50%,0)}}
@media(prefers-reduced-motion:reduce){
  :is(#section-wD90by-v5Q,.product-list-container) .image-wrapper::after,
  :is(#section-wD90by-v5Q,.product-list-container) .hl-product-list-product-image{transition:none!important}
  :is(#section-wD90by-v5Q,.product-list-container) .image-wrapper:hover .hl-product-list-product-image{transform:none!important}
}
</style>

<style id="ynd-capsule-actions">
:is(#section-wD90by-v5Q,.product-list-container) :is(.hl-add-to-cart-btn,.hl-choose-options-btn,.apply-button,.ec-pagination-btn,.ec-mobile-sort-btn,.ec-mobile-filter-btn),
:is(#section-wD90by-v5Q,.product-list-container) .image-wrapper::after,
.ynd-shop :is(.ynd-tabs button,.ynd-more,.ynd-image-action,.ynd-modal-copy button){border-radius:999px!important}
</style>
